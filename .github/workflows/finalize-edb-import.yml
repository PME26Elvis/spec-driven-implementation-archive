name: Finalize staged EDB import

on:
  push:
    branches: [main]
    paths:
      - '.staging/edb-import2/**'
      - '.github/workflows/finalize-edb-import.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for complete staged payload
        id: ready
        shell: bash
        run: |
          if [[ -f .staging/edb-import2/READY ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Staged payload is not complete yet; nothing to finalize.'
          fi

      - name: Reconstruct and verify payload
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat .staging/edb-import2/part-* > /tmp/edb-upload.b64
          echo '054727f38703184ab96b65a1acf313ab73267253b781d4e487d6dd444c5cd15a  /tmp/edb-upload.b64' | sha256sum -c -
          base64 --decode /tmp/edb-upload.b64 > /tmp/edb-upload.tar.xz
          tar -xJf /tmp/edb-upload.tar.xz -C .

      - name: Commit finalized archive content
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .staging/edb-import2
          rm -f .github/workflows/finalize-edb-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Add Grok embedded database run and export tools'
          git push origin HEAD:main
