name: Build recorded runs

on:
  workflow_dispatch:
    inputs:
      run:
        description: Recorded run to build
        required: true
        type: choice
        default: all
        options:
          - all
          - markdown
          - darc
          - physics-sandbox
          - embedded-database
          - pinball-win32-workbuddy
          - sudoku-win32-workbuddy
          - darc-chatgpt
          - elevator-chatgpt
          - cvc-chatgpt
  pull_request:
    paths:
      - .github/workflows/run-builds.yml

permissions:
  contents: read

jobs:
  markdown:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'markdown' }}
    name: Markdown Editor (X11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-x11-markdown/2026-08-10-gpt-work-5.6-sol-max/project/c17_x11_markdown_editor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libxft-dev libfontconfig1-dev \
            libpng-dev libjpeg-dev

      - name: Clean and build
        run: |
          make clean
          make all

  darc:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'darc' }}
    name: DARC v0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-darc-v0.1.0/2026-08-12-grok-4.5-fast-web/project/darc_gates_closed_v0.1/darc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Clean and build
        run: |
          make clean
          make all

  physics-sandbox:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'physics-sandbox' }}
    name: 2D Physics Sandbox (X11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-x11-physics-sandbox/2026-08-14-grok-4.5-fast-web/project/physics_sandbox_v1.0_wip/physics_sandbox
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libx11-dev

      - name: Clean and build
        run: |
          make clean
          make all

  embedded-database:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'embedded-database' }}
    name: Embedded Database Engine (X11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-x11-embedded-database-engine/2026-08-17-grok-4.5-fast-web/project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libx11-dev

      - name: Clean and build
        run: |
          make clean
          make all

  pinball-win32-workbuddy:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'pinball-win32-workbuddy' }}
    name: Pinball Sandbox (Win32 · WorkBuddy Hy3)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Recreate recorded build layout
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE 'runs\c17-win32-pinball-benchmark\2026-08-17-hy3-192k-workbuddy-default\project\pinball_sandbox_v1.0.0_without_evidence'
          $recordedRoot = 'D:\0814\pinball_sandbox_v1.0.0'
          $toolchainLink = 'D:\0814\toolchain\mingw64'
          $toolchainTarget = Join-Path $env:MSYS2_LOCATION 'mingw64'

          if (Test-Path $recordedRoot) {
            Remove-Item -Recurse -Force $recordedRoot
          }
          New-Item -ItemType Directory -Force -Path 'D:\0814\toolchain' | Out-Null
          Copy-Item -LiteralPath $source -Destination $recordedRoot -Recurse -Force

          if (Test-Path $toolchainLink) {
            Remove-Item -Recurse -Force $toolchainLink
          }
          New-Item -ItemType Junction -Path $toolchainLink -Target $toolchainTarget | Out-Null

          if (-not (Test-Path 'D:\0814\toolchain\mingw64\bin\gcc.exe')) {
            throw 'Recorded MinGW path was not created successfully.'
          }

      - name: Build recorded project
        shell: msys2 {0}
        run: |
          bash /d/0814/pinball_sandbox_v1.0.0/tools/build_core.sh
          bash /d/0814/pinball_sandbox_v1.0.0/tools/build_app.sh
          bash /d/0814/pinball_sandbox_v1.0.0/tools/build_tools.sh

      - name: Verify expected binaries
        shell: pwsh
        run: |
          $expected = @(
            'D:\0814\pinball_sandbox_v1.0.0\build\pinball_sandbox.exe',
            'D:\0814\pinball_sandbox_v1.0.0\build\simcheck.exe',
            'D:\0814\pinball_sandbox_v1.0.0\build\scenecheck.exe',
            'D:\0814\pinball_sandbox_v1.0.0\build\locscan.exe',
            'D:\0814\pinball_sandbox_v1.0.0\build\releasecheck.exe'
          )

          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Missing expected binaries: $($missing -join ', ')"
          }

          $expected | ForEach-Object { Write-Host "PASS: $_" }

  sudoku-win32-workbuddy:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'sudoku-win32-workbuddy' }}
    name: Sudoku (Win32 · WorkBuddy Hy3 192k)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runs/c17-win32-sudoku/2026-08-20-hy3-192k-workbuddy-code-development/project/0820-sudoku-workbuddy_curated
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate MSVC and clean-build archived project
        shell: cmd
        run: |
          @echo on
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found
            exit /b 1
          )

          set "VSROOT="
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (
            echo A Visual Studio installation with MSVC x64 tools was not found
            exit /b 1
          )

          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not defined VCToolsInstallDir (
            echo VsDevCmd did not initialize VCToolsInstallDir
            exit /b 1
          )

          call build.cmd
          if errorlevel 1 exit /b 1

      - name: Verify expected binary
        shell: cmd
        run: |
          if not exist "build\bin\sudoku.exe" (
            echo Missing build\bin\sudoku.exe
            exit /b 1
          )
          echo PASS: build\bin\sudoku.exe

  darc-chatgpt:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'darc-chatgpt' }}
    name: DARC v0.1.0 (ChatGPT · GPT-5.6 Sol High)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-darc-v0.1.0/2026-08-31-gpt-chat-5.6-sol-high/project/darc_v0.1.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Clean and build
        run: |
          make clean
          make all

  elevator-chatgpt:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'elevator-chatgpt' }}
    name: Elevator Group Control (ChatGPT · GPT-5.6 Sol Medium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-elevator-group-control/2026-08-31-gpt-chat-5.6-sol-medium/project/elevator_group_control_v1.0.2_impl_final_curated
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Clean and build
        run: |
          make clean
          make all

  cvc-chatgpt:
    if: ${{ github.event_name == 'pull_request' || inputs.run == 'all' || inputs.run == 'cvc-chatgpt' }}
    name: CVC POSIX (ChatGPT · GPT-5.6 Sol High)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runs/c17-posix-cvc/2026-08-31-gpt-chat-5.6-sol-high/project/cvc_taskpack_v1.0.1_implementation_release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Clean and build
        run: |
          make clean
          make all
