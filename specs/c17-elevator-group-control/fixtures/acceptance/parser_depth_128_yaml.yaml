schema_version: '1.0'
scenario:
  name: A01 Minimal Two Floor
  seed: 42
building:
  floors: 2
  floor_height_m: 3.6
  lobby_floor: 1
elevators:
- id: E1
  capacity_persons: 4
  max_speed_mps: 2
  acceleration_mps2: 1
  deceleration_mps2: 1
  door_open_ms: 500
  door_close_ms: 500
  door_min_dwell_ms: 500
  boarding_ms_per_person: 500
  alighting_ms_per_person: 500
  boarding_lanes: 2
  alighting_lanes: 2
  initial_floor: 1
  service_min_floor: 1
  service_max_floor: 2
simulation:
  duration_s: 60
  tick_ms: 100
  end_mode: drain
  max_drain_s: 600
  deadlock_window_s: 300
  starvation_threshold_s: 120
traffic:
  mode: trace
  trace_file: fixtures/acceptance/traces/a01_minimal.csv
algorithms:
  default_compare:
  - nearest_car
  - directional_collective
  - scan_look
  - eta_cost
  - zoning
  - adaptive_peak
  - destination_control
