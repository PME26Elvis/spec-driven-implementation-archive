  directional_collective: {}
  scan_look: {}
  eta_cost: {}
  zoning: {}
  adaptive_peak: {}
  destination_control: {}
metrics:
  sla_wait_s: 60
  histogram_bucket_s: 10
  histogram_max_s: 300
  percentiles:
  - 50
  - 90
  - 95
  - 99
  energy:
    move_per_meter: 1.0
    startup: 4.0
    door_cycle: 2.0
    direction_reversal: 3.0
    idle_per_second: 0.01
    load_meter_factor: 0.02
output:
  event_log: true
  passenger_csv: true
  elevator_csv: true
  summary_json: true
  summary_txt: true
  histogram_txt: true
  comparison_csv: true
  sample_interval_s: 1
  line_ending: lf
allow_unknown_fields: true
